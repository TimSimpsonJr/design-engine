<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title><PAGE_NAME></title>
  <link rel="stylesheet" href="./styles/theme.css">
  <style>
    /* Page-specific styles inline. Move to a separate file for production. */
    .page-shell { max-width: 430px; margin: 0 auto; padding-bottom: 96px; min-height: 100vh; }
    .top-bar { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .hero-card, .section-card {
      margin: 0 24px 24px 24px;
      background: var(--card);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: var(--shadow-card);
    }
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 24px 24px; }
    .kpi-card { background: var(--card); border-radius: var(--radius-card); padding: 16px; box-shadow: var(--shadow-card); }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); font-weight: 700; margin: 0 0 8px 0; }
    .metric-hero { font-size: 48px; font-weight: 700; line-height: 1; color: var(--foreground); margin: 0; }
    .metric-hero .unit { font-size: 24px; margin-left: 2px; color: var(--text-secondary); }
    .metric-kpi { font-size: 36px; font-weight: 700; line-height: 1; margin: 0; }
    .metric-kpi .unit { font-size: 18px; margin-left: 2px; }
    .trend { font-size: 13px; color: var(--success); font-weight: 700; margin-top: 8px; }
    .section-title { font-size: 18px; font-weight: 700; margin: 0 0 16px 0; }
  </style>
</head>
<body>
  <!-- Generated by design-engine /design-page
       Recipe: <RECIPE_NAME>
       Adapter: plain-css
       Reference: see design-language skill rules 14, 18, 19, 61-63 -->
  <div class="page-shell">
    <header class="top-bar">
      <h1 class="section-title"><PAGE_NAME></h1>
      <p style="font-size: 13px; color: var(--text-tertiary); margin: 0;">Today</p>
    </header>

    <section class="hero-card">
      <p class="label">PRIMARY METRIC</p>
      <p class="metric-hero">0<span class="unit">unit</span></p>
      <p class="trend">+0.0% vs last period</p>
    </section>

    <section class="kpi-grid">
      <div class="kpi-card">
        <p class="label">METRIC</p>
        <p class="metric-kpi">0<span class="unit">u</span></p>
      </div>
      <div class="kpi-card">
        <p class="label">METRIC</p>
        <p class="metric-kpi">0<span class="unit">u</span></p>
      </div>
    </section>

    <section class="section-card">
      <h3 class="section-title">Recent Activity</h3>
      <!-- List items go here -->
    </section>
  </div>
</body>
</html>
